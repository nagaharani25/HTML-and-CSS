<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Page</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    padding: 20px;
}

h1 {
    color: #333;
}

ul.nav-items {
    list-style-type: circle;
    padding-left: 20px;
}

ul.nav-items li a {
    color: rgb(238,130,233);
    text-decoration: none;  
    font-weight: bold;
}

/* Underline About Us and Contact Us */
ul.nav-items li:nth-child(2) a,
ul.nav-items li:nth-child(3) a {
    text-decoration: underline;
}

ul.nav-items li a:hover {
    color: purple;
}

.videos {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.video-container {
    width: 350px;
}

iframe {
    width: 100%;
    height: 200px;
    border: 1px solid #ccc;
}

h3 {
    color: #555;
}
</style>
</head>

<body>

<h1>This is my course page</h1>

<ul class="nav-items">
    <li><a href="Home.html">Homepage</a></li>
    <li><a href="About Us.html">About Us</a></li>
    <li><a href="Contact Us.html">Contact Us</a></li>
</ul>

<div class="videos">
    <div class="video-container">
        <h3>Video 1</h3>
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="video-container">
        <h3>Video 2</h3>
        <iframe src="https://www.youtube.com/embed/9bZkp7q19f0" frameborder="0" allowfullscreen></iframe>
    </div>

        <h3>Video 3</h3>

</html>
