<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Boxes Example</title>

    <style>
        
        .first-box {
            width: 200px;
            height: 100px;
            border: 2px solid black;
            padding: 20px;
            background-color: rgb(230, 229, 173);
        }

        
        .second-box {
            width: 200px;
            height: 100px;
            border: 2px solid black;
            margin: 20px;
            background-color: lavenderblush;
        }
    </style>
</head>

<body>

    <div class="first-box">
        First Box
    </div>

    <div class="second-box">
        Second Box
    </div>

</body>

</html>
