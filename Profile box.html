<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box</title>

<style>
.box{
    width:500px;
    height:300px;
    border:3px solid black;
    padding:20px;
    background-color:palevioletred;
    margin:0 auto;
    text-align:center;
}

.circle{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:20px auto;
    overflow:hidden;
    border:2px dashed black;
}

.circle img{
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>
</head>

<body style="background-color:aqua;">

<div class="box">

    <div class="circle">
        <img src="https://admin.thecricketer.com/weblab/sites/96c8b790-b593-bfda-0ba4-ecd3a9fdefc2/resources/images/site/kohli231007.jpg" alt="Virat Kohli">
    </div>

    <h3>Virat Kohli</h3>
    <p>I am learning HTML and CSS</p>

</div>

</body>
</html>
