<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Annamacharya University Results</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background-color:#f2f2f2;
}

header{
    background-color:#008b8b;
    color:white;
    padding:15px;
}

.header-container{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
}

.logo{
    width:90px;
    height:90px;
}

nav{
    background-color:black;
    padding:12px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 20px;
    font-weight:bold;
}

nav a:hover{
    color:#00ffff;
}

.container{
    width:420px;
    background:white;
    margin:70px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 12px gray;
    text-align:center;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
}

button{
    padding:10px 25px;
    background-color:#008b8b;
    color:white;
    border:none;
    border-radius:5px;
}

footer{
    background-color:black;
    color:white;
    text-align:center;
    padding:15px;
}

</style>
</head>

<body>

<header>
<div class="header-container">

<img src="" class="logo" alt="University Logo">

<div>
<h1>Annamacharya University</h1>
<p>Examination Results Portal</p>
</div>

</div>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Results</a>
<a href="#">Notifications</a>
<a href="#">Contact</a>
</nav>

<div class="container">

<h2>Check Your Result</h2>

<form>

<input type="text" placeholder="Enter Hall Ticket Number">

<input type="date">

<br><br>

<button type="submit">Get Result</button>

</form>

</div>

<footer>
<p>© 2026 Annamacharya University | All Rights Reserved</p>
</footer>

</body>
</html>
